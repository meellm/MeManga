name: Scraper health

# The live scraper probes (issue #255) against the real sites, weekly and
# by hand, never on pushes or pull requests. A failure means a source is
# down, blocks the runner, or changed its pages; health.json names the
# source and the stage that broke.

on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scraper-health
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - name: Install Linux system libraries for Qt
        # pytest-qt loads in every pytest run and imports Qt, which needs
        # these libraries (libEGL first) even though the probes use no
        # widgets. The same list as the CI test jobs.
        timeout-minutes: 10
        run: |
          apt_options="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get $apt_options update
          sudo apt-get $apt_options install -y \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-sync1 libxcb-util1 \
            libxcb-xfixes0 libxcb-xkb1 libxkbcommon-x11-0 \
            libegl1 libgl1 libfontconfig1 libdbus-1-3
      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements/dev.txt
          python -m pip install --no-deps -e .
          python -m playwright install --with-deps firefox chromium
      - name: Run live probes
        run: python -m pytest -m live tests/scrapers/live/ --health-report=health.json
      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scraper-health
          path: health.json
          if-no-files-found: warn
          retention-days: 30
