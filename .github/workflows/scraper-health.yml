name: Scraper health

# The live scraper probes (issue #255) against the real sites, weekly and
# by hand, never on pushes or pull requests. A failure means a source is
# down, blocks the runner, or changed its pages; health.json names the
# source and the stage that broke.

on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scraper-health
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements/dev.txt
          python -m pip install --no-deps -e .
          python -m playwright install --with-deps firefox chromium
      - name: Run live probes
        run: python -m pytest -m live tests/scrapers/live/ --health-report=health.json
      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scraper-health
          path: health.json
          if-no-files-found: warn
          retention-days: 30
