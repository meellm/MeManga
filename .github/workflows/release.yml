name: Build & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: MeManga.exe
            asset_name: MeManga-windows-x64.exe
          # macos-latest is an Apple Silicon (arm64) runner. The built
          # binary ships wrapped in MeManga.app inside a .zip (issue #163)
          # so the download is a normal double-clickable app, not a raw
          # extensionless Mach-O that opens in TextEdit. Developer ID
          # signing and notarization are optional: both macOS legs are
          # signed, notarized and stapled only when all of these repository
          # secrets are set: MACOS_CERTIFICATE_BASE64 (base64 of the
          # Developer ID Application .p12), MACOS_CERTIFICATE_PASSWORD,
          # MACOS_CODESIGN_IDENTITY ("Developer ID Application: Name
          # (TEAMID)"), APPLE_ID, APPLE_TEAM_ID and
          # APPLE_APP_SPECIFIC_PASSWORD. Without them the legs still ship
          # an unsigned MeManga.app zip.
          - os: macos-latest
            artifact_name: MeManga
            asset_name: MeManga-macos-arm64.zip
            target_arch: arm64
          # macos-26-intel is GitHub's current standard x64 macOS runner
          # image, so the x86_64 slice is built natively rather than
          # cross-compiled from Apple Silicon.
          - os: macos-26-intel
            artifact_name: MeManga
            asset_name: MeManga-macos-x64.zip
            target_arch: x86_64
          - os: ubuntu-latest
            artifact_name: MeManga
            asset_name: MeManga-linux-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect macOS notarization credentials
        # Issue #163: Developer ID signing and notarization need a paid
        # Apple Developer Program membership, so they are optional. With
        # all six secrets set this exposes macos_notarization=enabled and
        # the signing, notarization and Gatekeeper steps below run;
        # otherwise it exposes disabled, warns, and the leg still ships an
        # unsigned, unnotarized MeManga.app zip.
        id: notarization
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          missing=""
          for name in MACOS_CERTIFICATE_BASE64 MACOS_CERTIFICATE_PASSWORD \
                      MACOS_CODESIGN_IDENTITY APPLE_ID APPLE_TEAM_ID \
                      APPLE_APP_SPECIFIC_PASSWORD; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -z "$missing" ]; then
            echo "macOS notarization enabled: signing with Developer ID and notarizing"
            echo "macos_notarization=enabled" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::macOS notarization disabled (missing secrets:$missing). Building an unsigned, unnotarized MeManga.app zip; macOS Gatekeeper may warn about or block it on first launch."
            echo "macos_notarization=disabled" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Linux system libraries for Qt/XCB + image plugins
        # The Qt6 XCB platform plugin (libqxcb.so) and the imageformats
        # plugins link against a set of XCB / xkbcommon / TIFF / JPEG
        # system libs that the bare GitHub `ubuntu-latest` runner does
        # not ship. Without them PyInstaller emits 20+ "Library not
        # found" warnings and the frozen binary fails to launch on
        # vanilla Ubuntu desktops with "qt.qpa.plugin: Could not load
        # the Qt platform plugin 'xcb'".
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-sync1 libxcb-util1 \
            libxcb-xfixes0 libxcb-xkb1 libxkbcommon-x11-0 \
            libegl1 libgl1 libfontconfig1 libdbus-1-3

      - name: Install macOS system libraries for PDF dependencies
        # The macos-26-intel runner may need to build pikepdf from source
        # when a matching wheel is unavailable. Provide qpdf headers/libs so
        # that fallback build can complete instead of failing on
        # qpdf/Constants.h.
        if: runner.os == 'macOS'
        run: brew install qpdf

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Import Developer ID signing certificate
        # Decode the Developer ID Application .p12 into a throwaway
        # keychain on the runner so PyInstaller and codesign can use it.
        # The keychain password is random per run; nothing is persisted.
        if: steps.notarization.outputs.macos_notarization == 'enabled'
        shell: bash
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        run: |
          keychain="$RUNNER_TEMP/memanga-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          cert="$RUNNER_TEMP/developer-id.p12"
          echo "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$cert"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$cert" -k "$keychain" -f pkcs12 \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          rm -f "$cert"
          if ! security find-identity -v -p codesigning "$keychain" \
               | grep -F "$MACOS_CODESIGN_IDENTITY" \
               | grep -q "Developer ID Application"; then
            echo "::error::MACOS_CODESIGN_IDENTITY does not name a Developer ID Application identity in the imported certificate"
            exit 1
          fi

      - name: Build release executable
        # build_app.py produces a single-file binary under `release/`
        # (release/MeManga.exe on Windows, release/MeManga elsewhere)
        # and sweeps the build/ + dist/ scratch dirs afterwards.
        #
        # MEMANGA_TARGET_ARCH pins the macOS CPU slice (see
        # packaging/memanga-release.spec). It is empty on Windows/Linux,
        # where the spec ignores it and follows the build host.
        #
        # With macOS notarization enabled, MEMANGA_CODESIGN_IDENTITY /
        # MEMANGA_ENTITLEMENTS_FILE make PyInstaller sign every embedded
        # binary and the executable with the Developer ID identity and
        # hardened runtime (issue #163). The identity is empty on unsigned
        # macOS builds and on Windows/Linux, where the spec ignores both.
        env:
          MEMANGA_TARGET_ARCH: ${{ matrix.target_arch }}
          MEMANGA_CODESIGN_IDENTITY: ${{ steps.notarization.outputs.macos_notarization == 'enabled' && secrets.MACOS_CODESIGN_IDENTITY || '' }}
          MEMANGA_ENTITLEMENTS_FILE: ${{ runner.os == 'macOS' && 'packaging/macos-entitlements.plist' || '' }}
        run: python build_app.py

      - name: Verify macOS artifact architecture
        # Guard against the release silently shipping the wrong slice
        # (issue #146). `lipo -archs` reports the Mach-O bootloader's
        # architecture; it must equal the arch this matrix leg targets
        # before the binary is renamed and uploaded.
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bin="release/${{ matrix.artifact_name }}"
          archs=$(lipo -archs "$bin")
          echo "lipo -archs $bin -> $archs"
          if [ "$archs" != "${{ matrix.target_arch }}" ]; then
            echo "::error::Expected ${{ matrix.target_arch }} slice but built binary reports '$archs'"
            exit 1
          fi

      - name: Verify Playwright works inside the built executable (Windows)
        # Release gate for issue #28: run the actual artifact on the
        # pristine runner — the same "fresh machine, first session"
        # conditions the bug reproduced under. The flag installs Firefox
        # through the bundled driver and launches it through the normal
        # Playwright transport; a non-zero exit fails the release.
        #
        # Start-Process WITHOUT stream redirection is deliberate: it
        # detaches the windowed exe from the runner's console so it gets
        # null standard handles, exactly like a user double-click. A
        # plain shell invocation would pipe valid handles in and mask
        # the very environment this gate exists to prove.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\release\${{ matrix.artifact_name }}" `
                 -ArgumentList "--verify-playwright" -PassThru -Wait
          Write-Host "----- runtime.log -----"
          Get-Content "$env:USERPROFILE\.config\memanga\runtime.log" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) {
            Write-Error "Playwright self-test failed in the built executable (exit $($p.ExitCode))"
            exit 1
          }

      - name: Verify Playwright works inside the built executable (macOS)
        # Same gate for the macOS artifact (it had its own variant of the
        # browsers-path bug). Skipped on Linux: the bare runner lacks
        # Firefox's system libraries and the issue is specific to the
        # windowed Windows/macOS artifacts.
        if: runner.os == 'macOS'
        shell: bash
        run: |
          "./release/${{ matrix.artifact_name }}" --verify-playwright || {
            echo "::error::Playwright self-test failed in the built executable"
            echo "----- runtime.log -----"
            cat "$HOME/.config/memanga/runtime.log" 2>/dev/null || true
            exit 1
          }

      - name: Package macOS app bundle (MeManga.app)
        # Root-cause fix for issue #163. GitHub serves the raw one-file
        # Mach-O as application/octet-stream, so a browser download lands
        # as an extensionless document (opens in TextEdit) and loses its
        # executable bit (mode 0644). Wrap the just-verified binary in a
        # minimal MeManga.app so users get a normal app to double-click.
        # When notarization is enabled the bundle is signed, notarized and
        # stapled below before it is archived into the release .zip.
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python packaging/macos_app.py build \
            --exe "release/${{ matrix.artifact_name }}" \
            --dest release \
            --icon packaging/icon.icns

      - name: Sign macOS app bundle
        # PyInstaller already signed the one-file executable and every
        # binary embedded in it. The hand-built MeManga.app wrapper still
        # needs its own seal over Info.plist and Resources, so the bundle
        # is signed with the same Developer ID identity, hardened runtime,
        # secure timestamp and entitlements, then verified strictly.
        if: steps.notarization.outputs.macos_notarization == 'enabled'
        shell: bash
        env:
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          app="release/MeManga.app"
          codesign --force --options runtime --timestamp \
            --entitlements packaging/macos-entitlements.plist \
            --sign "$MACOS_CODESIGN_IDENTITY" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          details="$(codesign --display --verbose=4 "$app" 2>&1)"
          echo "$details"
          if ! echo "$details" | grep -q "^Authority=Developer ID Application"; then
            echo "::error::MeManga.app is not signed with a Developer ID Application certificate"
            exit 1
          fi
          if ! echo "$details" | grep -q "^TeamIdentifier=$APPLE_TEAM_ID$"; then
            echo "::error::MeManga.app signature Team ID does not match APPLE_TEAM_ID"
            exit 1
          fi
          if ! echo "$details" | grep -Eq "^CodeDirectory .*flags=.*runtime"; then
            echo "::error::MeManga.app signature does not enable the hardened runtime"
            exit 1
          fi

      - name: Notarize and staple macOS app bundle
        # Apple notarizes a container, so the signed bundle is zipped with
        # `ditto` just for submission. `notarytool --wait` blocks until
        # Apple's verdict; anything but Accepted prints the notary log and
        # fails the release. The ticket is then stapled to MeManga.app so
        # Gatekeeper can verify it offline on first launch.
        if: steps.notarization.outputs.macos_notarization == 'enabled'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          submission="$RUNNER_TEMP/MeManga-notarize.zip"
          result="$RUNNER_TEMP/notarization.json"
          read_field='import json, sys; print(json.load(open(sys.argv[1])).get(sys.argv[2], ""))'
          ditto -c -k --keepParent "release/MeManga.app" "$submission"
          xcrun notarytool submit "$submission" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait --timeout 1h --output-format json > "$result" || true
          cat "$result"
          status="$(python -c "$read_field" "$result" status 2>/dev/null || true)"
          if [ "$status" != "Accepted" ]; then
            submission_id="$(python -c "$read_field" "$result" id 2>/dev/null || true)"
            if [ -n "$submission_id" ]; then
              xcrun notarytool log "$submission_id" \
                --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
                --password "$APPLE_APP_SPECIFIC_PASSWORD" || true
            fi
            echo "::error::Apple notarization did not accept MeManga.app (status: '$status')"
            exit 1
          fi
          xcrun stapler staple "release/MeManga.app"
          xcrun stapler validate "release/MeManga.app"

      - name: Verify Gatekeeper accepts the macOS app
        # The check a user's Mac runs on first launch: `spctl` must accept
        # the stapled bundle as notarized Developer ID software. A
        # rejection here is the "MeManga is damaged" dialog from #163.
        if: steps.notarization.outputs.macos_notarization == 'enabled'
        shell: bash
        run: |
          # GitHub macOS runners may ship with Gatekeeper disabled, in which
          # case spctl reports "accepted (override=security disabled)"
          # instead of judging the notarization. Turn it on and prove it.
          echo "spctl --status before: $(spctl --status 2>&1 || true)"
          sudo spctl --global-enable 2>/dev/null || sudo spctl --master-enable
          gk_status="$(spctl --status 2>&1 || true)"
          echo "spctl --status after: $gk_status"
          if ! echo "$gk_status" | grep -q "assessments enabled"; then
            echo "::error::Could not enable Gatekeeper assessments on the runner"
            exit 1
          fi
          if ! assessment="$(spctl --assess --type execute --verbose=4 "release/MeManga.app" 2>&1)"; then
            echo "$assessment"
            echo "::error::Gatekeeper rejected MeManga.app"
            exit 1
          fi
          echo "$assessment"
          if ! echo "$assessment" | grep -q "source=Notarized Developer ID"; then
            echo "::error::Gatekeeper did not assess MeManga.app as notarized Developer ID software"
            exit 1
          fi

      - name: Verify Playwright works inside the signed macOS app
        # The bundle re-sign above rewrites the launcher's signature, so
        # run the final stapled MeManga.app launcher itself under the
        # hardened runtime and entitlements before it is zipped. A
        # missing entitlement shows up here as a launch failure.
        if: steps.notarization.outputs.macos_notarization == 'enabled'
        shell: bash
        run: |
          "release/MeManga.app/Contents/MacOS/MeManga" --verify-playwright || {
            echo "::error::Playwright self-test failed in the signed MeManga.app"
            echo "----- runtime.log -----"
            cat "$HOME/.config/memanga/runtime.log" 2>/dev/null || true
            exit 1
          }

      - name: Archive macOS app bundle (.zip)
        # Zip the bundle (stapled when notarization is enabled) for the
        # release. `ditto` preserves the exec bit, bundle layout and any
        # code signature; `--keepParent` keeps MeManga.app as the
        # top-level folder inside the zip.
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ditto -c -k --keepParent "release/MeManga.app" "${{ matrix.asset_name }}"

      - name: Validate packaged macOS app bundle
        # Release gate on the exact .zip that gets uploaded, signed or not:
        # it must hold a launchable MeManga.app/Contents/MacOS/MeManga
        # (exec bit set), a valid Info.plist and the CPU slice this matrix
        # leg targets.
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python packaging/macos_app.py validate \
            --path "${{ matrix.asset_name }}" \
            --arch "${{ matrix.target_arch }}"

      - name: Verify release zip is signed, stapled and notarized
        # Notarized builds only: the uploaded .zip must also carry a code
        # signature and a stapled notarization ticket. The archive is then
        # extracted as a user would and re-checked with codesign, stapler
        # and spctl so the shipped bytes, not just the build tree, pass
        # Gatekeeper.
        if: steps.notarization.outputs.macos_notarization == 'enabled'
        shell: bash
        run: |
          python packaging/macos_app.py validate \
            --path "${{ matrix.asset_name }}" \
            --arch "${{ matrix.target_arch }}" \
            --require-signed --require-stapled
          workdir="$(mktemp -d)"
          ditto -x -k "${{ matrix.asset_name }}" "$workdir"
          extracted="$workdir/MeManga.app"
          codesign --verify --deep --strict --verbose=2 "$extracted"
          xcrun stapler validate "$extracted"
          # GitHub macOS runners may ship with Gatekeeper disabled, in which
          # case spctl reports "accepted (override=security disabled)"
          # instead of judging the notarization. Turn it on and prove it.
          echo "spctl --status before: $(spctl --status 2>&1 || true)"
          sudo spctl --global-enable 2>/dev/null || sudo spctl --master-enable
          gk_status="$(spctl --status 2>&1 || true)"
          echo "spctl --status after: $gk_status"
          if ! echo "$gk_status" | grep -q "assessments enabled"; then
            echo "::error::Could not enable Gatekeeper assessments on the runner"
            exit 1
          fi
          assessment="$(spctl --assess --type execute --verbose=4 "$extracted" 2>&1)" || true
          echo "$assessment"
          if ! echo "$assessment" | grep -q "source=Notarized Developer ID"; then
            echo "::error::Extracted MeManga.app from the release zip is not accepted by Gatekeeper"
            exit 1
          fi

      - name: Package artifact for upload
        id: package
        shell: bash
        run: |
          asset="${{ matrix.asset_name }}"
          if [ "${{ runner.os }}" = "macOS" ]; then
            echo "upload_path=$asset" >> "$GITHUB_OUTPUT"
          else
            bin="release/${{ matrix.artifact_name }}"
            mv "$bin" "$asset"
            if [ "${{ runner.os }}" = "Linux" ]; then
              chmod +x "$asset"
              tar -czf "${asset}.tar.gz" "$asset"
              echo "upload_path=${asset}.tar.gz" >> "$GITHUB_OUTPUT"
            else
              echo "upload_path=$asset" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Verify Linux archive preserves the executable bit
        # Release gate for issue #167: prove the tarball actually restores
        # a runnable binary before it can reach the release page. Extract
        # into a scratch dir and assert the extracted file is executable;
        # a dropped +x bit fails the build instead of shipping a download
        # users cannot launch.
        if: runner.os == 'Linux'
        shell: bash
        run: |
          asset="${{ matrix.asset_name }}"
          workdir="$(mktemp -d)"
          tar -xzf "${asset}.tar.gz" -C "$workdir"
          extracted="$workdir/$asset"
          ls -l "$extracted"
          if [ ! -x "$extracted" ]; then
            echo "::error::Extracted Linux binary is not executable — release would ship an unlaunchable file"
            exit 1
          fi
          echo "OK: extracted binary is executable"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ steps.package.outputs.upload_path }}
          retention-days: 7

      - name: Remove macOS signing keychain
        if: always() && steps.notarization.outputs.macos_notarization == 'enabled'
        shell: bash
        run: security delete-keychain "$RUNNER_TEMP/memanga-signing.keychain-db" || true

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Flatten artifact tree
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: release/*
