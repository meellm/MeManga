name: Build & Release

on:
  push:
    tags:
      - "v*"
  # One-shot recovery of v0.5.0 (see the recovery-proof job). It has no
  # inputs, so a manual run cannot name another version or commit.
  workflow_dispatch:

# Only the release job writes to the repository: it creates the release.
permissions:
  contents: read

# On a tag push these are that tag and its commit, and RECOVERY_SOURCE is
# empty, so every checkout keeps its default. A manual run builds the
# v0.5.0 tree with this workflow; only its release spec is replaced (see
# the build job).
env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && 'v0.5.0' || github.ref_name }}
  RELEASE_SHA: ${{ github.event_name == 'workflow_dispatch' && '969798f361ea18fb0c63b8bedde10479477de593' || github.sha }}
  RECOVERY_SOURCE: ${{ github.event_name == 'workflow_dispatch' && '969798f361ea18fb0c63b8bedde10479477de593' || '' }}

# Manual runs wait for each other, so a second one sees what the first
# published. A tag push is alone in its group.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'release-recovery-v0.5.0' || github.run_id }}

jobs:
  notes:
    # Issue #285: a tag whose version has no CHANGELOG.md section fails
    # here, in seconds, before the tests, the audit and the release builds
    # start. So does a tag without its short announcement, which the
    # release job uses as the release text.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RECOVERY_SOURCE }}

      - name: Check the release notes in CHANGELOG.md
        run: python3 scripts/release_notes.py "$RELEASE_TAG" > /dev/null

      - name: Check the release announcement
        run: grep -q '[^[:space:]]' ".github/release-announcements/${RELEASE_TAG}.md"

  tests:
    # Issue #317: the routine CI of the tag's tree, the full suite on Linux
    # and the core tests on the other Python versions, Windows and macOS.
    # It runs while the release legs build; nothing is published unless it
    # passes.
    needs: notes
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml
    with:
      upload_dist: true
    permissions:
      contents: read

  audit:
    # Issue #385: no release with a known vulnerability in its locks.
    needs: notes
    if: github.event_name == 'push'
    uses: ./.github/workflows/dependency-audit.yml
    permissions:
      contents: read

  locks:
    # Issue #316: the release builds only when every lock of this tag is
    # exactly what its pyproject.toml generates, rows, markers and hashes
    # included: the full check that pull requests get, not only the
    # recorded input digest. uv, which generates the locks again, is
    # installed from its hashed wheel (the manylinux x86_64 one for
    # ubuntu-latest; it changes with UV_VERSION in
    # scripts/lock_dependencies.py) and stays out of the build environment.
    needs: notes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RECOVERY_SOURCE }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check the locks are what pyproject.toml generates
        shell: bash
        run: |
          echo "uv==0.13.1 --hash=sha256:696dcf6d807d85da978f4db8472da81dccc1254b18b52cbd1367c4d923c421e0" > "$RUNNER_TEMP/uv.txt"
          python -m pip install --require-hashes --only-binary :all: -r "$RUNNER_TEMP/uv.txt"
          python scripts/lock_dependencies.py --check

  recovery-proof:
    # One-shot recovery of v0.5.0: its tag run passed its checks, then the
    # Windows build stopped before anything was released. A manual run from
    # main builds the tag's source with this workflow and one fixed build
    # file. It repeats no test or audit and no Docker publication. This job
    # requires the green CI of the exact commit and passes on the sdist and
    # wheel already checked in the tag run. It runs no repository code.
    #
    # If a later job fails, re-run the failed jobs: this job keeps its
    # result and nothing is built again unless a build failed. Running all
    # jobs again, or a new manual run, stops here once the GitHub Release or
    # the PyPI version is published. A draft release is not visible here;
    # the release job reuses it.
    needs: notes
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      TAG_OBJECT: 42b3ff8ce3ce011e9eac25f2f12834907e345cc2
      CI_RUN: "45052487628"
      SOURCE_RUN: "45059290359"
      PACKAGE_ARTIFACT: "14769015500"
      PACKAGE_DIGEST: sha256:f50c0a59930c1591b00ee58ba4bbcec1d5a4f617ec573973dd71f29f1a0b1957
    steps:
      - name: Prove the source, its checks and its packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          expect() {
            if [ "$2" != "$3" ]; then
              echo "::error::$1: expected '$3', got '$2'"
              exit 1
            fi
          }
          repo="repos/$GITHUB_REPOSITORY"
          expect "workflow ref" "$GITHUB_REF" "refs/heads/main"

          # The tag is the same annotated tag, on the same commit.
          expect "tag" \
            "$(gh api "$repo/git/ref/tags/$RELEASE_TAG" --jq '[.ref, .object.type, .object.sha] | join(" ")')" \
            "refs/tags/$RELEASE_TAG tag $TAG_OBJECT"
          expect "tagged commit" \
            "$(gh api "$repo/git/tags/$TAG_OBJECT" --jq '[.tag, .object.type, .object.sha] | join(" ")')" \
            "$RELEASE_TAG commit $RELEASE_SHA"

          # The full CI passed on exactly this commit.
          expect "CI run" \
            "$(gh api "$repo/actions/runs/$CI_RUN" --jq '[.path, .event, .head_branch, .head_sha, .status, .conclusion, .head_repository.full_name] | join(" ")')" \
            ".github/workflows/ci.yml push main $RELEASE_SHA completed success $GITHUB_REPOSITORY"

          # The tag run checked this source and made these packages.
          expect "tag run" \
            "$(gh api "$repo/actions/runs/$SOURCE_RUN" --jq '[.path, .event, .head_branch, .head_sha, (.run_attempt | tostring), .head_repository.full_name] | join(" ")')" \
            ".github/workflows/release.yml push $RELEASE_TAG $RELEASE_SHA 1 $GITHUB_REPOSITORY"
          jobs="$(gh api "$repo/actions/runs/$SOURCE_RUN/attempts/1/jobs?per_page=100" --jq '.jobs[] | [.name, .status, .conclusion] | @tsv')"
          for job in "notes" "locks" "audit / osv-scanner" "tests / package" "pypi-check"; do
            expect "tag run job $job" \
              "$(grep -cFx -- "$job"$'\t'"completed"$'\t'"success" <<< "$jobs")" 1
          done
          expect "package artifact" \
            "$(gh api "$repo/actions/runs/$SOURCE_RUN/artifacts?name=python-dist" --jq '[.total_count, (.artifacts[] | .id, .name, .expired, .digest, .workflow_run.id, .workflow_run.head_sha)] | map(tostring) | join(" ")')" \
            "1 $PACKAGE_ARTIFACT python-dist false $PACKAGE_DIGEST $SOURCE_RUN $RELEASE_SHA"

          # Nothing is published yet. Only an exact 404 counts as absent.
          release_status="$(gh api --include "$repo/releases/tags/$RELEASE_TAG" 2>/dev/null | sed -n '1s/^HTTP[^ ]* \([0-9]*\).*/\1/p' || true)"
          expect "GitHub Release $RELEASE_TAG" "$release_status" 404
          pypi_status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "https://pypi.org/pypi/memanga/${RELEASE_TAG#v}/json" || true)"
          expect "PyPI memanga ${RELEASE_TAG#v}" "$pypi_status" 404

      - name: Download the checked sdist and wheel from the tag run
        # The action fails if the files do not match the artifact's digest.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN }}

      - name: Record the package hashes
        run: sha256sum dist/*

      - name: Keep the same files for this run
        # pypi-check and publish-pypi read them from this run as usual.
        uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  build:
    needs: [locks, recovery-proof]
    if: ${{ !cancelled() && needs.locks.result == 'success' && (github.event_name == 'push' || needs.recovery-proof.result == 'success') }}
    strategy:
      matrix:
        include:
          # Windows and Linux ship the one-folder app (issue #381) archived
          # under the asset's base name; artifact_name is the launcher inside
          # release/MeManga/. macOS ships the one-file executable in an .app.
          - os: windows-latest
            artifact_name: MeManga.exe
            asset_name: MeManga-windows-x64.zip
          # macos-latest is an Apple Silicon (arm64) runner. The built
          # binary ships wrapped in MeManga.app inside a .zip (issue #163)
          # so the download is a normal double-clickable app, not a raw
          # extensionless Mach-O that opens in TextEdit. Developer ID
          # signing and notarization are optional: both macOS legs are
          # signed, notarized and stapled only when all of these repository
          # secrets are set: MACOS_CERTIFICATE_BASE64 (base64 of the
          # Developer ID Application .p12), MACOS_CERTIFICATE_PASSWORD,
          # MACOS_CODESIGN_IDENTITY ("Developer ID Application: Name
          # (TEAMID)"), APPLE_ID, APPLE_TEAM_ID and
          # APPLE_APP_SPECIFIC_PASSWORD. Without them the legs still ship
          # an unsigned MeManga.app zip.
          - os: macos-latest
            artifact_name: MeManga
            asset_name: MeManga-macos-arm64.zip
            target_arch: arm64
          # macos-26-intel is GitHub's current standard x64 macOS runner
          # image, so the x86_64 slice is built natively rather than
          # cross-compiled from Apple Silicon.
          - os: macos-26-intel
            artifact_name: MeManga
            asset_name: MeManga-macos-x64.zip
            target_arch: x86_64
          - os: ubuntu-latest
            artifact_name: MeManga
            asset_name: MeManga-linux-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RECOVERY_SOURCE }}

      - name: Use the fixed release spec (v0.5.0 recovery only)
        # The tag's spec bundles Tcl/Tk and the Windows Universal CRT, which
        # the notices gate rejects and the app does not need in its bundle.
        # Only this build file comes from the commit of this workflow, at an
        # exact blob; the program source stays the tag's. The spec names that
        # commit in the notices of the download.
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          TAG_SPEC_BLOB: 06a7ca436acc5af675d34c1f1ca0686a09f12d31
          FIXED_SPEC_BLOB: 4eeb9e54fdb7b36901d24bb2109518dbe6fbd975
        run: |
          spec=packaging/memanga-release.spec
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test -z "$(git status --porcelain)"
          test "$(git rev-parse "HEAD:$spec")" = "$TAG_SPEC_BLOB"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          test "$(git rev-parse "FETCH_HEAD:$spec")" = "$FIXED_SPEC_BLOB"
          git show "FETCH_HEAD:$spec" > "$spec"
          test "$(git hash-object --no-filters -- "$spec")" = "$FIXED_SPEC_BLOB"
          test "$(git status --porcelain)" = " M $spec"
          git --no-pager diff -- "$spec"

      - name: Detect macOS notarization credentials
        # Issue #163: Developer ID signing and notarization need a paid
        # Apple Developer Program membership, so they are optional. With
        # all six secrets set this exposes macos_notarization=enabled and
        # the signing, notarization and Gatekeeper steps below run;
        # otherwise it exposes disabled, warns, and the leg still ships an
        # unsigned, unnotarized MeManga.app zip.
        id: notarization
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          missing=""
          for name in MACOS_CERTIFICATE_BASE64 MACOS_CERTIFICATE_PASSWORD \
                      MACOS_CODESIGN_IDENTITY APPLE_ID APPLE_TEAM_ID \
                      APPLE_APP_SPECIFIC_PASSWORD; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -z "$missing" ]; then
            echo "macOS notarization enabled: signing with Developer ID and notarizing"
            echo "macos_notarization=enabled" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::macOS notarization disabled (missing secrets:$missing). Building an unsigned, unnotarized MeManga.app zip; macOS Gatekeeper may warn about or block it on first launch."
            echo "macos_notarization=disabled" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Create the isolated build environment
        # setup-python selects the runner's shared Python, which can hold
        # tools of its own (pipx and its dependencies on Windows). The build
        # uses a new environment without access to them, so the check below
        # can keep requiring exactly the lock. GITHUB_PATH puts its python
        # first from the next step on.
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/build-env"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cygpath -w "$RUNNER_TEMP/build-env/Scripts" >> "$GITHUB_PATH"
          else
            echo "$RUNNER_TEMP/build-env/bin" >> "$GITHUB_PATH"
          fi

      - name: Confirm the build Python is isolated
        # In the default shell of each leg, the one the install step uses,
        # and before anything is installed.
        run: |
          python -c "import os, sys; env = os.path.join(os.environ['RUNNER_TEMP'], 'build-env'); sys.exit(None if os.path.samefile(sys.prefix, env) else f'{sys.prefix} is not the build environment')"

      - name: Check release tag matches the project version
        # Issue #381: the notices direct users to tag v<project version>
        # for the source and build files of their download. A tag that
        # differs (a typo, or a version bump that was not tagged) would
        # point them at a different tree, so it fails before any build.
        shell: bash
        run: python packaging/third_party_notices.py check-tag "$RELEASE_TAG"

      - name: Install Linux system libraries for Qt/XCB + image plugins
        # The Qt6 XCB platform plugin (libqxcb.so) and the imageformats
        # plugins link against a set of XCB / xkbcommon / TIFF / JPEG
        # system libs that the bare GitHub `ubuntu-latest` runner does
        # not ship. Without them PyInstaller emits 20+ "Library not
        # found" warnings and the frozen binary fails to launch on
        # vanilla Ubuntu desktops with "qt.qpa.plugin: Could not load
        # the Qt platform plugin 'xcb'".
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-sync1 libxcb-util1 \
            libxcb-xfixes0 libxcb-xkb1 libxkbcommon-x11-0 \
            libegl1 libgl1 libfontconfig1 libdbus-1-3

      - name: Install dependencies
        # Issue #316: only the release pins (hashes, PyInstaller included),
        # which the locks job checked. --require-hashes fails on any row
        # without a hash; --only-binary installs wheels only, because
        # building an sdist would fetch its build tools unpinned and
        # unchecked; --force-reinstall downloads and hash-checks every row
        # even when the environment already has that version. pip stays the
        # one the new environment started with: upgrading it would be an
        # unpinned download.
        run: |
          python -m pip install --require-hashes --only-binary :all: --force-reinstall -r requirements/build.txt

      - name: Check the build environment holds only the lock
        # Fails the release before it builds when the build Python has a
        # package requirements/build.txt does not pin, another version of
        # one it does, more than one copy of one, one installed from a URL
        # or path, or misses one of its rows for this platform. Only pip is
        # allowed besides. It compares names and versions; the file
        # contents are the ones the install step just hash-checked.
        run: python scripts/lock_dependencies.py --check-installed build

      - name: Import Developer ID signing certificate
        # Decode the Developer ID Application .p12 into a throwaway
        # keychain on the runner so PyInstaller and codesign can use it.
        # The keychain password is random per run; nothing is persisted.
        if: steps.notarization.outputs.macos_notarization == 'enabled'
        shell: bash
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        run: |
          keychain="$RUNNER_TEMP/memanga-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          cert="$RUNNER_TEMP/developer-id.p12"
          echo "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$cert"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$cert" -k "$keychain" -f pkcs12 \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          rm -f "$cert"
          if ! security find-identity -v -p codesigning "$keychain" \
               | grep -F "$MACOS_CODESIGN_IDENTITY" \
               | grep -q "Developer ID Application"; then
            echo "::error::MACOS_CODESIGN_IDENTITY does not name a Developer ID Application identity in the imported certificate"
            exit 1
          fi

      - name: Build release executable
        # build_app.py produces the app under `release/` (the one-folder
        # release/MeManga/ on Windows / Linux, which it checks with
        # `third_party_notices.py check-bundle`; the one-file
        # release/MeManga on macOS) and sweeps the build/ + dist/ scratch
        # dirs afterwards.
        #
        # MEMANGA_TARGET_ARCH pins the macOS CPU slice (see
        # packaging/memanga-release.spec). It is empty on Windows/Linux,
        # where the spec ignores it and follows the build host.
        #
        # With macOS notarization enabled, MEMANGA_CODESIGN_IDENTITY /
        # MEMANGA_ENTITLEMENTS_FILE make PyInstaller sign every embedded
        # binary and the executable with the Developer ID identity and
        # hardened runtime (issue #163). The identity is empty on unsigned
        # macOS builds and on Windows/Linux, where the spec ignores both.
        #
        # --no-install: it builds from the environment installed and
        # checked above rather than installing into it again.
        env:
          MEMANGA_TARGET_ARCH: ${{ matrix.target_arch }}
          MEMANGA_CODESIGN_IDENTITY: ${{ steps.notarization.outputs.macos_notarization == 'enabled' && secrets.MACOS_CODESIGN_IDENTITY || '' }}
          MEMANGA_ENTITLEMENTS_FILE: ${{ runner.os == 'macOS' && 'packaging/macos-entitlements.plist' || '' }}
          # Recovery only: the commit whose release spec built this download.
          MEMANGA_RECIPE_COMMIT: ${{ github.event_name == 'workflow_dispatch' && github.sha || '' }}
        run: python build_app.py --no-install

      - name: Check third-party notices
        # Release gate for issue #380. The release spec writes
        # release/THIRD_PARTY_NOTICES.txt from the files PyInstaller actually
        # bundled and fails if a component has no license text. Re-check the
        # written file: the MeManga and Python runtime license texts, the
        # key bundled components and every referenced Appendix text.
        shell: bash
        run: |
          python packaging/third_party_notices.py check release/THIRD_PARTY_NOTICES.txt \
            --require pyside6-essentials --require shiboken6 --require playwright \
            --require pyinstaller --require certifi --require pikepdf --require img2pdf

      - name: Confirm the notices name the recovery recipe
        # Recovery only: the shipped notices must name the commit whose
        # workflow and release spec built this download.
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: grep -Fq "$GITHUB_SHA" release/THIRD_PARTY_NOTICES.txt

      - name: Verify macOS artifact architecture
        # Guard against the release silently shipping the wrong slice
        # (issue #146). `lipo -archs` reports the Mach-O bootloader's
        # architecture; it must equal the arch this matrix leg targets
        # before the binary is renamed and uploaded.
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bin="release/${{ matrix.artifact_name }}"
          archs=$(lipo -archs "$bin")
          echo "lipo -archs $bin -> $archs"
          if [ "$archs" != "${{ matrix.target_arch }}" ]; then
            echo "::error::Expected ${{ matrix.target_arch }} slice but built binary reports '$archs'"
            exit 1
          fi

      - name: Verify Playwright works inside the built executable (Windows)
        # Release gate for issue #28: run the actual artifact on the
        # pristine runner — the same "fresh machine, first session"
        # conditions the bug reproduced under. The flag installs Firefox
        # through the bundled driver and launches it through the normal
        # Playwright transport; a non-zero exit fails the release.
        #
        # Start-Process WITHOUT stream redirection is deliberate: it
        # detaches the windowed exe from the runner's console so it gets
        # null standard handles, exactly like a user double-click. A
        # plain shell invocation would pipe valid handles in and mask
        # the very environment this gate exists to prove.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\release\MeManga\${{ matrix.artifact_name }}" `
                 -ArgumentList "--verify-playwright" -PassThru -Wait
          Write-Host "----- runtime.log -----"
          Get-Content "$env:USERPROFILE\.config\memanga\runtime.log" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) {
            Write-Error "Playwright self-test failed in the built executable (exit $($p.ExitCode))"
            exit 1
          }

      - name: Verify Playwright works inside the built executable (macOS)
        # Same gate for the macOS artifact (it had its own variant of the
        # browsers-path bug). Skipped on Linux: the bare runner lacks
        # Firefox's system libraries and the issue is specific to the
        # windowed Windows/macOS artifacts.
        if: runner.os == 'macOS'
        shell: bash
        run: |
          "./release/${{ matrix.artifact_name }}" --verify-playwright || {
            echo "::error::Playwright self-test failed in the built executable"
            echo "----- runtime.log -----"
            cat "$HOME/.config/memanga/runtime.log" 2>/dev/null || true
            exit 1
          }

      - name: Package macOS app bundle (MeManga.app)
        # Root-cause fix for issue #163. GitHub serves the raw one-file
        # Mach-O as application/octet-stream, so a browser download lands
        # as an extensionless document (opens in TextEdit) and loses its
        # executable bit (mode 0644). Wrap the just-verified binary in a
        # minimal MeManga.app so users get a normal app to double-click.
        # When notarization is enabled the bundle is signed, notarized and
        # stapled below before it is archived into the release .zip.
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python packaging/macos_app.py build \
            --exe "release/${{ matrix.artifact_name }}" \
            --dest release \
            --icon packaging/icon.icns \
            --resource release/THIRD_PARTY_NOTICES.txt

      - name: Sign macOS app bundle
        # PyInstaller already signed the one-file executable and every
        # binary embedded in it. The hand-built MeManga.app wrapper still
        # needs its own seal over Info.plist and Resources, so the bundle
        # is signed with the same Developer ID identity, hardened runtime,
        # secure timestamp and entitlements, then verified strictly.
        if: steps.notarization.outputs.macos_notarization == 'enabled'
        shell: bash
        env:
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          app="release/MeManga.app"
          codesign --force --options runtime --timestamp \
            --entitlements packaging/macos-entitlements.plist \
            --sign "$MACOS_CODESIGN_IDENTITY" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          details="$(codesign --display --verbose=4 "$app" 2>&1)"
          echo "$details"
          if ! echo "$details" | grep -q "^Authority=Developer ID Application"; then
            echo "::error::MeManga.app is not signed with a Developer ID Application certificate"
            exit 1
          fi
          if ! echo "$details" | grep -q "^TeamIdentifier=$APPLE_TEAM_ID$"; then
            echo "::error::MeManga.app signature Team ID does not match APPLE_TEAM_ID"
            exit 1
          fi
          if ! echo "$details" | grep -Eq "^CodeDirectory .*flags=.*runtime"; then
            echo "::error::MeManga.app signature does not enable the hardened runtime"
            exit 1
          fi

      - name: Notarize and staple macOS app bundle
        # Apple notarizes a container, so the signed bundle is zipped with
        # `ditto` just for submission. `notarytool --wait` blocks until
        # Apple's verdict; anything but Accepted prints the notary log and
        # fails the release. The ticket is then stapled to MeManga.app so
        # Gatekeeper can verify it offline on first launch.
        if: steps.notarization.outputs.macos_notarization == 'enabled'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          submission="$RUNNER_TEMP/MeManga-notarize.zip"
          result="$RUNNER_TEMP/notarization.json"
          read_field='import json, sys; print(json.load(open(sys.argv[1])).get(sys.argv[2], ""))'
          ditto -c -k --keepParent "release/MeManga.app" "$submission"
          xcrun notarytool submit "$submission" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait --timeout 1h --output-format json > "$result" || true
          cat "$result"
          status="$(python -c "$read_field" "$result" status 2>/dev/null || true)"
          if [ "$status" != "Accepted" ]; then
            submission_id="$(python -c "$read_field" "$result" id 2>/dev/null || true)"
            if [ -n "$submission_id" ]; then
              xcrun notarytool log "$submission_id" \
                --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
                --password "$APPLE_APP_SPECIFIC_PASSWORD" || true
            fi
            echo "::error::Apple notarization did not accept MeManga.app (status: '$status')"
            exit 1
          fi
          xcrun stapler staple "release/MeManga.app"
          xcrun stapler validate "release/MeManga.app"

      - name: Verify Gatekeeper accepts the macOS app
        # The check a user's Mac runs on first launch: `spctl` must accept
        # the stapled bundle as notarized Developer ID software. A
        # rejection here is the "MeManga is damaged" dialog from #163.
        if: steps.notarization.outputs.macos_notarization == 'enabled'
        shell: bash
        run: |
          # GitHub macOS runners may ship with Gatekeeper disabled, in which
          # case spctl reports "accepted (override=security disabled)"
          # instead of judging the notarization. Turn it on and prove it.
          echo "spctl --status before: $(spctl --status 2>&1 || true)"
          sudo spctl --global-enable 2>/dev/null || sudo spctl --master-enable
          gk_status="$(spctl --status 2>&1 || true)"
          echo "spctl --status after: $gk_status"
          if ! echo "$gk_status" | grep -q "assessments enabled"; then
            echo "::error::Could not enable Gatekeeper assessments on the runner"
            exit 1
          fi
          if ! assessment="$(spctl --assess --type execute --verbose=4 "release/MeManga.app" 2>&1)"; then
            echo "$assessment"
            echo "::error::Gatekeeper rejected MeManga.app"
            exit 1
          fi
          echo "$assessment"
          if ! echo "$assessment" | grep -q "source=Notarized Developer ID"; then
            echo "::error::Gatekeeper did not assess MeManga.app as notarized Developer ID software"
            exit 1
          fi

      - name: Verify Playwright works inside the signed macOS app
        # The bundle re-sign above rewrites the launcher's signature, so
        # run the final stapled MeManga.app launcher itself under the
        # hardened runtime and entitlements before it is zipped. A
        # missing entitlement shows up here as a launch failure.
        if: steps.notarization.outputs.macos_notarization == 'enabled'
        shell: bash
        run: |
          "release/MeManga.app/Contents/MacOS/MeManga" --verify-playwright || {
            echo "::error::Playwright self-test failed in the signed MeManga.app"
            echo "----- runtime.log -----"
            cat "$HOME/.config/memanga/runtime.log" 2>/dev/null || true
            exit 1
          }

      - name: Archive macOS app bundle (.zip)
        # Zip the bundle (stapled when notarization is enabled) for the
        # release. `ditto` preserves the exec bit, bundle layout and any
        # code signature; `--keepParent` keeps MeManga.app as the
        # top-level folder inside the zip.
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ditto -c -k --keepParent "release/MeManga.app" "${{ matrix.asset_name }}"

      - name: Validate packaged macOS app bundle
        # Release gate on the exact .zip that gets uploaded, signed or not:
        # it must hold a launchable MeManga.app/Contents/MacOS/MeManga
        # (exec bit set), a valid Info.plist and the CPU slice this matrix
        # leg targets.
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python packaging/macos_app.py validate \
            --path "${{ matrix.asset_name }}" \
            --arch "${{ matrix.target_arch }}" \
            --require-resource THIRD_PARTY_NOTICES.txt

      - name: Verify release zip is signed, stapled and notarized
        # Notarized builds only: the uploaded .zip must also carry a code
        # signature and a stapled notarization ticket. The archive is then
        # extracted as a user would and re-checked with codesign, stapler
        # and spctl so the shipped bytes, not just the build tree, pass
        # Gatekeeper.
        if: steps.notarization.outputs.macos_notarization == 'enabled'
        shell: bash
        run: |
          python packaging/macos_app.py validate \
            --path "${{ matrix.asset_name }}" \
            --arch "${{ matrix.target_arch }}" \
            --require-signed --require-stapled \
            --require-resource THIRD_PARTY_NOTICES.txt
          workdir="$(mktemp -d)"
          ditto -x -k "${{ matrix.asset_name }}" "$workdir"
          extracted="$workdir/MeManga.app"
          codesign --verify --deep --strict --verbose=2 "$extracted"
          xcrun stapler validate "$extracted"
          # GitHub macOS runners may ship with Gatekeeper disabled, in which
          # case spctl reports "accepted (override=security disabled)"
          # instead of judging the notarization. Turn it on and prove it.
          echo "spctl --status before: $(spctl --status 2>&1 || true)"
          sudo spctl --global-enable 2>/dev/null || sudo spctl --master-enable
          gk_status="$(spctl --status 2>&1 || true)"
          echo "spctl --status after: $gk_status"
          if ! echo "$gk_status" | grep -q "assessments enabled"; then
            echo "::error::Could not enable Gatekeeper assessments on the runner"
            exit 1
          fi
          assessment="$(spctl --assess --type execute --verbose=4 "$extracted" 2>&1)" || true
          echo "$assessment"
          if ! echo "$assessment" | grep -q "source=Notarized Developer ID"; then
            echo "::error::Extracted MeManga.app from the release zip is not accepted by Gatekeeper"
            exit 1
          fi

      - name: Package artifact for upload
        id: package
        shell: bash
        # Every leg also ships the third-party notices (issue #380) as a
        # separate <asset>-THIRD_PARTY_NOTICES.txt release asset, so they can
        # be read before download. The Windows .zip and Linux tarball hold
        # the one-folder app (issue #381) under the asset's base name, with
        # the same file at its top level; the macOS app has it in
        # Contents/Resources.
        run: |
          asset="${{ matrix.asset_name }}"
          base="${asset%.zip}"
          notices="${base}-THIRD_PARTY_NOTICES.txt"
          cp release/THIRD_PARTY_NOTICES.txt "$notices"
          echo "notices_path=$notices" >> "$GITHUB_OUTPUT"
          if [ "${{ runner.os }}" = "macOS" ]; then
            echo "upload_path=$asset" >> "$GITHUB_OUTPUT"
          else
            mv release/MeManga "$base"
            if [ "${{ runner.os }}" = "Linux" ]; then
              chmod +x "$base/${{ matrix.artifact_name }}"
              tar -czf "${base}.tar.gz" "$base"
              echo "upload_path=${base}.tar.gz" >> "$GITHUB_OUTPUT"
            else
              python -c "import shutil, sys; shutil.make_archive(sys.argv[1], 'zip', '.', sys.argv[1])" "$base"
              echo "upload_path=$asset" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Verify Linux archive preserves the executable bit
        # Release gate for issue #167: prove the tarball actually restores
        # a runnable binary before it can reach the release page. Extract
        # into a scratch dir and assert the extracted file is executable;
        # a dropped +x bit fails the build instead of shipping a download
        # users cannot launch.
        if: runner.os == 'Linux'
        shell: bash
        run: |
          asset="${{ matrix.asset_name }}"
          workdir="$(mktemp -d)"
          tar -xzf "${asset}.tar.gz" -C "$workdir"
          extracted="$workdir/$asset/${{ matrix.artifact_name }}"
          ls -l "$extracted"
          if [ ! -x "$extracted" ]; then
            echo "::error::Extracted Linux binary is not executable — release would ship an unlaunchable file"
            exit 1
          fi
          echo "OK: extracted binary is executable"
          # Issue #380: the tarball must carry valid third-party notices.
          python packaging/third_party_notices.py check \
            "$workdir/$asset/THIRD_PARTY_NOTICES.txt" --require pyside6-essentials
          # Issue #381: the LGPL components must still be separate,
          # unpacked files in the extracted folder.
          python packaging/third_party_notices.py check-bundle "$workdir/$asset"

      - name: Verify Windows archive keeps LGPL files replaceable
        # Issue #381 gate on the exact .zip that gets uploaded: extract it
        # as a user would and check the folder holds the launcher, valid
        # notices at its top level and the LGPL components as separate,
        # unpacked files.
        if: runner.os == 'Windows'
        shell: bash
        run: |
          asset="${{ matrix.asset_name }}"
          base="${asset%.zip}"
          # A native Windows path for the native Python below.
          workdir="$RUNNER_TEMP/memanga-zip-check"
          rm -rf "$workdir"
          python -c "import shutil, sys; shutil.unpack_archive(sys.argv[1], sys.argv[2])" "$asset" "$workdir"
          python packaging/third_party_notices.py check-bundle "$workdir/$base"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ steps.package.outputs.upload_path }}
            ${{ steps.package.outputs.notices_path }}
          retention-days: 7

      - name: Remove macOS signing keychain
        if: always() && steps.notarization.outputs.macos_notarization == 'enabled'
        shell: bash
        run: security delete-keychain "$RUNNER_TEMP/memanga-signing.keychain-db" || true

  pypi-check:
    # Issue #218: decides whether this tag goes to PyPI. Older and
    # prerelease tags are left out and their release continues. A stable
    # tag from 0.5.0 on must be on main with the matching sdist and wheel;
    # otherwise this job fails and no GitHub Release is created.
    needs: [tests, recovery-proof]
    if: ${{ !cancelled() && ((github.event_name == 'push' && needs.tests.result == 'success') || (github.event_name == 'workflow_dispatch' && needs.recovery-proof.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RECOVERY_SOURCE }}
          # The whole history, to check the tagged commit is on main.
          fetch-depth: 0

      - name: Download the checked sdist and wheel
        uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist

      - name: Check the tag, its commit and the packages
        id: gate
        run: python3 scripts/pypi_release_gate.py "$RELEASE_TAG" "$RELEASE_SHA" dist

  release:
    needs: [build, tests, audit, pypi-check]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.pypi-check.result == 'success' && (github.event_name == 'workflow_dispatch' || (needs.tests.result == 'success' && needs.audit.result == 'success')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RECOVERY_SOURCE }}

      - name: Download the app artifacts
        # Only the desktop downloads: the sdist and wheel go to PyPI.
        uses: actions/download-artifact@v8
        with:
          pattern: MeManga-*
          path: artifacts/

      - name: Flatten artifact tree
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # An existing tag is used as it is; the release does not move it.
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: .github/release-announcements/${{ env.RELEASE_TAG }}.md
          generate_release_notes: false
          files: release/*

  publish-pypi:
    # Issue #218: runs only after the GitHub Release succeeded, on the
    # files pypi-check read. PyPI's trusted publisher names this workflow
    # file and the pypi environment, and does not accept a called workflow,
    # so the job stays here. It runs no repository code.
    needs: [release, pypi-check]
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.pypi-check.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/memanga/
    permissions:
      id-token: write
    steps:
      - name: Download the checked sdist and wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
