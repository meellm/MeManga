name: Scraper broken
description: A specific source stopped working
title: "[scraper] "
labels: [scraper]
body:
  - type: markdown
    attributes:
      value: |
        Issues are public. Remove passwords, tokens, email addresses and your user name in file paths from anything you paste. Never post your `config.yaml`: it can contain your app password.
  - type: input
    id: source
    attributes:
      label: Source
      description: The domain of the site.
      placeholder: mangapill.com
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page where it happens
      description: >-
        The address of the series or chapter. If the problem is not about one
        page, for example in a search, write `n/a`.
      placeholder: https://example.com/manga/some-title
    validations:
      required: true
  - type: dropdown
    id: problem
    attributes:
      label: What went wrong?
      multiple: true
      options:
        - Search finds nothing
        - Search shows the wrong series
        - The chapter list is empty
        - A chapter has no pages
        - A download fails or stops partway
        - Something else
    validations:
      required: true
  - type: input
    id: action
    attributes:
      label: Command or desktop action
      description: The command you ran or what you clicked when it went wrong.
      placeholder: memanga check, or Library → Check all
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MeManga version
      description: >-
        The desktop app shows it in the window title. On the command line,
        run `memanga --version`. With Docker, give the image tag.
      placeholder: "0.5.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 15, Ubuntu 24.04
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install MeManga?
      options:
        - Desktop download from the releases page
        - Docker
        - PyPI package (pip, pipx or uv)
        - Command line from source
        - Desktop app from source
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or error message
      description: >-
        Paste the relevant part of the terminal output or of a
        [log file](https://meellm.github.io/MeManga/guide/troubleshooting#log-files).
        If there is nothing to paste, write `none`.
      render: text
    validations:
      required: true
  - type: textarea
    id: probe
    attributes:
      label: Live probe output (contributors only)
      description: >-
        Optional, and only if you already have a
        [development setup](https://meellm.github.io/MeManga/developer/contributing).
        You do not need to run this to report a problem. The
        [live probe](https://meellm.github.io/MeManga/developer/scrapers#live-probe)
        is `pytest -m live tests/scrapers/live/test_live_parsing.py -k DOMAIN -v`.
      render: text
