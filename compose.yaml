x-memanga: &memanga
  build: .
  image: memanga:cli
  volumes:
    - memanga-config:/home/memanga/.config/memanga
    - memanga-downloads:/home/memanga/Downloads/MeManga

services:
  # One-off commands: docker compose run --rm memanga <command>
  memanga:
    <<: *memanga
    command: ["list"]

  # Scheduled checks: docker compose up -d scheduler
  scheduler:
    <<: *memanga
    command: ["watch", "--every", "6h", "--jitter", "30m"]
    restart: unless-stopped
    # Time for a running check to save its state on docker stop.
    stop_grace_period: 1m

volumes:
  memanga-config:
  memanga-downloads:
