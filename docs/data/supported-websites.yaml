# The groups and order of the Supported websites page.
#
# Curated by hand: which group a site belongs to and, within a group, which
# sites come first. Better-known sites go first. This is an editorial
# judgement, not a traffic measurement, and it does not change the order in
# which search asks sources (POPULAR_SOURCES in memanga/scrapers/catalog.py).
#
# List each source once, by the domain in the catalog; its other domains are
# added for you. Do not add facts here: language, adult content, search state
# and other domains come from the catalog.
#
# After a change, run: python -m memanga.source_docs
# The check fails if a source is missing, unknown or listed twice, if adult
# sources are not all in the last category, or if a source with a language
# of its own is in the wrong language group.

